<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kodlang · Inglés con Kodi</title>
<style>
:root{--bg:#fbfffc;--card:#fff;--ink:#23332b;--mut:#6c7f74;--line:#dff1e6;--pri:#178a55;--onpri:#fff;--pri2:#e6f9ef;--pk:#ffe6f1;--pkd:#d6336c;--ok:#178a55;--okbg:#e0f8ea;--bad:#d6336c;--badbg:#ffe3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121b16;--card:#1b2822;--ink:#eefaf2;--mut:#9db3a5;--line:#2c3f35;--pri:#5fdc9f;--onpri:#0d2418;--pri2:#223a2d;--pk:#3d2431;--pkd:#ff8fb8;--okbg:#17402a;--badbg:#45212f}}
:root[data-theme="dark"]{--bg:#121b16;--card:#1b2822;--ink:#eefaf2;--mut:#9db3a5;--line:#2c3f35;--pri:#5fdc9f;--onpri:#0d2418;--pri2:#223a2d;--pk:#3d2431;--pkd:#ff8fb8;--okbg:#17402a;--badbg:#45212f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:1.6rem;margin:0}h2{font-size:1.2rem;margin:.3rem 0 .6rem}.logo b{color:var(--pri)}.logo i{color:var(--pkd);font-style:normal}
.mut{color:var(--mut);font-size:.9rem}
.btn{border:0;border-radius:14px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer;background:var(--pri);color:var(--onpri);width:100%;margin-top:8px}
.btn.ghost{background:var(--pri2);color:var(--pri)}.btn:disabled{opacity:.4;cursor:not-allowed}
.back{background:none;border:0;color:var(--mut);font-size:.95rem;cursor:pointer;padding:6px 0}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pkd));transition:width .3s}
.mod{display:flex;gap:14px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px;cursor:pointer;width:100%;text-align:left;color:var(--ink);font:inherit}
.mod.lock{opacity:.5;cursor:not-allowed}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;flex:none;background:var(--pri2)}
.stars{color:var(--pkd);letter-spacing:2px;white-space:nowrap}.stars .off{color:var(--line)}
.kd{display:flex;align-items:flex-end;gap:10px;margin:8px 0}.kimg{flex:none;height:auto}
.bub{background:var(--pk);border-radius:16px 16px 16px 4px;padding:10px 12px;flex:1;font-size:.95rem}
.slack{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;margin:10px 0}
.msg{display:flex;gap:10px;margin:8px 0}.av{width:36px;height:36px;border-radius:10px;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-weight:800;flex:none}.av.p{background:var(--pkd);color:#fff}
.msg small{color:var(--mut);margin-left:6px}.txt{font-size:1.1rem}
.tag{display:inline-block;font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);margin-right:6px}.tag.i{background:var(--pk);color:var(--pkd)}
.pic{font-size:4rem;text-align:center;line-height:1.2}
.es{margin-top:10px;padding-top:10px;border-top:2px dashed var(--line)}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;margin:8px 0;font:inherit;color:var(--ink);cursor:pointer}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit;cursor:pointer}
.drop{min-height:62px;border:2px dashed var(--pkd);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inp{width:100%;font:inherit;font-size:1.1rem;padding:13px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin-top:8px}
.blank{color:var(--pkd);border-bottom:3px solid var(--pkd)}
.fb{border-radius:16px;padding:8px 12px;margin:12px 0}.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pkd)}
.tabs{display:flex;gap:8px;margin:10px 0}.tab{flex:1;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:11px;font:inherit;font-weight:700;cursor:pointer}.tab.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.sp{background:none;border:0;font-size:1.1rem;cursor:pointer}.c{text-align:center}
</style>
</head>

function ld(){try{var s0=localStorage.getItem(T?"kl_p2":"kl_p");P=s0?JSON.parse(s0):[0,0,0,0]}catch(e){P=[0,0,0,0]}}ld();
function sv(){try{localStorage.setItem(T?"kl_p2":"kl_p",JSON.stringify(P))}catch(e){}}
function $(h){document.getElementById("app").innerHTML=h}
function K(t,w){return '<div class="kd"><img class="kimg" style="width:'+(w||64)+'px" src="'+KODI+'" alt="Kodi"><div class="bub">'+t+'</div></div>'}
function st(n){var o="";for(var i=0;i<3;i++)o+=i<n?"★":'<span class="off">★</span>';return '<span class="stars">'+o+'</span>'}
function say(t){try{var u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function go(v,m){S.v=v;if(m!==undefined)S.m=m;S.i=0;S.q=0;S.sc=0;S.miss=[];S.ans=null;S.fb=null;S.pick=[];if(v=="quiz")prep();render()}
function prep(){var e=M[S.m].ex[S.q];S.ord=[];if(e[0]=="o")S.bank=shuf(e[2].split(" "));else if(e[0]!="t")S.ord=shuf(mc(e).o.map(function(_,k){return k}))}
function mc(e){return e[0]=="m"?{o:e[2],a:e[3],w:e[4]}:e[0]=="c"?{o:e[2],a:e[3],w:e[4]}:{o:e[3],a:e[4],w:e[5]}}
function setT(t){T=t;M=t?MA:MB;ld();render()}
function home(){var tot=P.reduce(function(a,b){return a+b},0);
var h='<h1 class="logo"><b>Kod</b><i>lang</i> 🐰</h1>'+'<div class="tabs"><button class="tab'+(T?"":" on")+'" onclick="setT(0)">Nivel 1 · Base</button><button class="tab'+(T?" on":"")+'" onclick="setT(1)">Nivel 2 · Avanzado</button></div>'+K(T?"¡Nivel avanzado! Aquí escribirás frases completas y resolverás situaciones reales con familias, líderes y equipo técnico.":"¡Hola! Soy <b>Kodi</b>, tu conejito guía. Aprendamos inglés para el trabajo, paso a paso.",84)+'<div class="mut">Tu avance: '+tot+' de 12 estrellas</div><div class="bar"><i style="width:'+(tot/12*100)+'%"></i></div>';
M.forEach(function(m,k){var l=k>0&&P[k-1]<1;h+='<button class="mod'+(l?' lock':'')+'" '+(l?'':'onclick="go(\'learn\','+k+')"')+'><div class="ico">'+(l?'🔒':m.ic)+'</div><div style="flex:1"><div class="mut">Módulo '+(k+1)+'</div><b>'+m.n+'</b><div class="mut">'+(l?'Consigue 1 estrella en el módulo anterior':m.d)+'</div></div>'+st(P[k])+'</button>'});
h+=T?'<p class="mut">Nivel 2: 6 frases avanzadas → 1 conversación → 8 ejercicios con frases completas y escritura. Mismas estrellas: 60% = 1★, 80% = 2★, 100% = 3★.</p>':'<p class="mut">Cada módulo: 6 frases con dibujos → 1 conversación → 10 ejercicios (dibujos, ordenar, escribir y chat). 60% = 1★, 80% = 2★, 100% = 3★.</p>';$(h)}
function learn(){var m=M[S.m],c=m.cards[S.i].split("|"),last=S.i==5;
var h='<button class="back" onclick="go(\'home\')">← Módulos</button><h2>'+m.ic+' '+m.n+'</h2><div class="dots">'+m.cards.map(function(_,k){return '<i class="'+(k<=S.i?'on':'')+'"></i>'}).join("")+'</div>';
h+='<div class="slack"><div class="pic">'+c[3]+'</div><div class="msg"><div class="av p">K</div><div style="flex:1"><b>Kodi</b><small>#english</small><div class="txt">'+c[0]+' <button class="sp" onclick="say(M['+S.m+'].cards['+S.i+'].split(\'|\')[0])" aria-label="Escuchar">🔊</button></div></div></div><div class="es"><span class="tag'+(c[4]=="i"?' i':'')+'">'+(c[4]=="i"?"Informal":"Slack")+'</span><b>'+c[1]+'</b><div class="mut">Úsala para: '+c[2]+'</div></div></div>'+K("Toca 🔊 y repítelo en voz alta. ¡Así se queda en la memoria!");
h+='<button class="btn" onclick="'+(last?"go('conv',"+S.m+")":"S.i++;render()")+'">'+(last?'Ver conversación 💬':'Siguiente')+'</button>';
if(S.i)h+='<button class="btn ghost" onclick="S.i--;render()">Anterior</button>';$(h)}
function conv(){var m=M[S.m],h='<button class="back" onclick="go(\'home\')">← Módulos</button><h2>Conversación real</h2>'+K("Lee el chat. Si te trabas, toca “Ver traducción”.");
h+='<div class="slack">'+m.cv.map(function(l,k){return '<div class="msg"><div class="av'+(k%2?' p':'')+'">'+l[0][0]+'</div><div style="flex:1"><b>'+l[0]+'</b><small>ahora</small><div class="txt">'+l[1]+' <button class="sp" onclick="say(M['+S.m+'].cv['+k+'][1])" aria-label="Escuchar">🔊</button></div>'+(S.tr?'<div class="mut">'+l[2]+'</div>':'')+'</div></div>'}).join("")+'</div>';
h+='<button class="btn ghost" onclick="S.tr=!S.tr;render()">'+(S.tr?'Ocultar traducción':'Ver traducción 🇪🇸')+'</button><button class="btn" onclick="go(\'quiz\')">¡A practicar! ✍️</button>';$(h)}
function quiz(){var m=M[S.m],e=m.ex[S.q],t=e[0],h='<button class="back" onclick="go(\'home\')">← Salir</button><div class="bar"><i style="width:'+(S.q/m.ex.length*100)+'%"></i></div><div class="mut">Ejercicio '+(S.q+1)+' de '+m.ex.length+'</div>';
if(t=="o"){h+='<h2>Arma la frase en inglés</h2><div class="slack"><b>'+e[1]+'</b></div><div class="drop">'+S.pick.map(function(k,j){return '<button class="chip" onclick="S.pick.splice('+j+',1);render()">'+S.bank[k]+'</button>'}).join("")+'</div><div class="chips">'+S.bank.map(function(w,k){return S.pick.indexOf(k)>-1?'':'<button class="chip" onclick="S.pick.push('+k+');render()">'+w+'</button>'}).join("")+'</div>';
if(!S.fb)h+='<button class="btn" '+(S.pick.length?'':'disabled')+' onclick="ochk()">Comprobar</button>'}
else if(t=="t"){h+='<h2>'+(e[1].indexOf("___")>-1?"Escribe lo que falta":"Escribe la frase en inglés")+'</h2><div class="slack"><div class="txt">'+e[1].replace("___",'<span class="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>')+'</div></div>';
if(!S.fb)h+='<input id="ti" class="inp" autocomplete="off" autocapitalize="off" placeholder="Escribe aquí…" onkeydown="if(event.key==\'Enter\')tchk()"><button class="btn" onclick="tchk()">Comprobar</button>'}
else{var x=mc(e);h+='<h2>'+(t=="m"?e[1]:t=="c"?"¿Cómo respondes en el chat?":"¿Qué frase va con este dibujo?")+'</h2>';
if(t=="c")h+='<div class="slack">'+e[1].map(function(l){return '<div class="msg"><div class="av">'+l[0][0]+'</div><div><b>'+l[0]+'</b><div class="txt">'+l[1]+'</div></div></div>'}).join("")+'</div>';
if(t=="p")h+='<div class="slack"><div class="pic">'+e[1]+'</div><div class="c mut">'+e[2]+'</div></div>';
h+=S.ord.map(function(k){var c="";if(S.ans!==null){if(k==x.a)c=" ok";else if(k==S.ans)c=" bad"}return '<button class="opt'+c+'" '+(S.ans!==null?'disabled':'')+' onclick="ch('+k+')">'+x.o[k]+'</button>'}).join("")}
if(S.fb)h+='<div class="fb '+(S.fb.ok?'ok':'bad')+'"><div class="kd"><img class="kimg" style="width:48px" src="'+KODI+'" alt="Kodi"><div><b>'+S.fb.t+'</b><div>'+S.fb.w+'</div></div></div></div><button class="btn" onclick="nxt()">'+(S.q==m.ex.length-1?'Ver resultados':'Continuar')+'</button>';$(h)}
function done(ok,e,txt){if(ok)S.sc++;else S.miss.push(e);var w=e[e.length-1];S.fb=ok?{ok:1,t:PR[Math.floor(Math.random()*5)],w:w}:{ok:0,t:"¡Casi! Así se aprende 🌱",w:txt+" "+w};render()}
function ch(k){var e=M[S.m].ex[S.q],x=mc(e);S.ans=k;done(k==x.a,e,"La correcta es: “"+x.o[x.a]+"”.")}
function ochk(){var e=M[S.m].ex[S.q];done(S.pick.map(function(k){return S.bank[k]}).join(" ")==e[2],e,"Frase correcta: “"+e[2]+"”.")}
function nz(s){return s.toLowerCase().replace(/\s+/g," ").replace(/[’‘]/g,"'").replace(/[.!?,\s]+$/,"").trim()}
function tchk(){var e=M[S.m].ex[S.q],v=document.getElementById("ti").value;if(!v.trim())return;done(e[2].split("|").map(nz).indexOf(nz(v))>-1,e,"Respuesta modelo: “"+e[2].split("|")[0]+"”.")}
